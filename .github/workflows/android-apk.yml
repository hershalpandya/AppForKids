name: Android APK smoke test

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  quality:
    name: Python and Gradle wrapper quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Check Java formatting
        run: bash scripts/format-java.sh --check
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
      - name: Install pinned Python quality tools
        run: python -m pip install -r requirements-dev.txt
      - name: Lint, format, type-check and test Python
        run: |
          python -m ruff check scripts tests
          python -m ruff format --check scripts tests
          python -m mypy
          python -m coverage erase
          python -m coverage run scripts/shuffled_tests.py --seed 11
          python -m coverage combine
          python -m coverage report
          python -m coverage erase
          python -m coverage run scripts/shuffled_tests.py --seed 29
          python -m coverage combine
          python -m coverage report

  grype:
    name: Grype vulnerability scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Scan repository with Grype
        uses: anchore/scan-action@11983a512817154c80a9db660c1a184be7513ed6 # v7.4.3
        with:
          path: .
          fail-build: true
          output-format: table
          severity-cutoff: medium

  offline-tablet:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_TABLET_IMAGE: "system-images;android-35;default;x86_64"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install SDK and tablet system image
        run: bash scripts/install-android-sdk.sh

      - name: Check approval and release validation
        run: python3 -m unittest discover -s tests -p test_release.py

      - name: Build the preview and both CI-signed releases
        run: |
          export APPFORKIDS_KEYSTORE="$RUNNER_TEMP/appforkids-ci.p12"
          export APPFORKIDS_KEY_ALIAS=appforkids-ci
          export APPFORKIDS_STORE_PASSWORD="$(openssl rand -hex 24)"
          export APPFORKIDS_KEY_PASSWORD="$APPFORKIDS_STORE_PASSWORD"
          keytool -genkeypair -keystore "$APPFORKIDS_KEYSTORE" -storetype PKCS12 \
            -storepass:env APPFORKIDS_STORE_PASSWORD -alias "$APPFORKIDS_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 365 -dname 'CN=AppForKids CI'
          ./gradlew --no-daemon :app:assembleRelease :app:lintRelease :app:assembleDebug :app:lintDebug 2>&1 | tee build/ci/gradle.log
          baseline=app/build/outputs/apk/release/app-release.apk
          approvals="$RUNNER_TEMP/appforkids-approvals"
          python3 scripts/release.py approve --store "$approvals" tests/fixtures/les-jetons-a-reunir.json
          python3 scripts/release.py approve --store "$approvals" tests/fixtures/compter-les-etoiles-corrige.json
          python3 scripts/release.py approve --store "$approvals" tests/fixtures/les-mots-de-meme-sens-corrige.json
          python3 - "$RUNNER_TEMP/jetons-revision-3.json" <<'PYTHON'
          import json
          import sys
          from pathlib import Path
          game = json.loads(Path("tests/fixtures/les-jetons-a-reunir.json").read_text(encoding="utf-8"))
          game.update(revision=3, title="Les jetons à réunir (autre version)")
          Path(sys.argv[1]).write_text(json.dumps(game, ensure_ascii=False), encoding="utf-8")
          PYTHON
          python3 scripts/release.py approve --store "$approvals" "$RUNNER_TEMP/jetons-revision-3.json"
          python3 scripts/release.py build --store "$approvals" \
            --game les-jetons-a-reunir@2 --game compter-les-etoiles@2 --game les-mots-de-meme-sens@2 \
            --version-code 2 --previous-apk "$baseline" --output build/ci/app-release-update.apk \
            2>&1 | tee build/ci/gradle-update.log

      - name: Enable KVM for the hosted runner
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check

      - name: Play the starter, preview and in-place update on an offline tablet
        run: |
          bash scripts/test-apk-on-emulator.sh \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/debug/app-debug.apk \
            build/ci/app-release-update.apk

      - name: Upload tested starter APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: appforkids-ci-tested-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload tested update APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: appforkids-ci-tested-update-apk
          path: build/ci/app-release-update.apk
          if-no-files-found: error

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-failure-diagnostics
          path: |
            build/ci/
            app/build/reports/lint-results-release.xml
          if-no-files-found: warn

  app-coverage:
    name: Installed-app line coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_TABLET_IMAGE: "system-images;android-35;default;x86_64"
      APPFORKIDS_PACKAGE: be.hershalpandya.appforkids.coverage
      APPFORKIDS_COVERAGE_DIR: build/ci/app-coverage
      # A new suite order each run; the seed is logged so a failure can be replayed.
      APPFORKIDS_SUITE_SEED: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install SDK and tablet system image
        run: bash scripts/install-android-sdk.sh

      - name: Build the instrumented coverage APK
        run: ./gradlew --no-daemon :app:assembleCoverage 2>&1 | tee build/ci/gradle-coverage.log

      - name: Enable KVM for the hosted runner
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check

      - name: Run installed-app suites in shuffled order
        run: bash scripts/test-apk-on-emulator.sh app/build/outputs/apk/coverage/app-coverage.apk

      - name: Require 70% line coverage
        run: |
          ./gradlew --no-daemon :app:appCoverageReport :app:appCoverageVerification \
            -PappforkidsCoverageData="$APPFORKIDS_COVERAGE_DIR"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-coverage-report
          path: |
            app/build/reports/jacoco/appCoverageReport/
            build/ci/
          if-no-files-found: warn
