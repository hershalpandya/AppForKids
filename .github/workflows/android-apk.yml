name: Android APK smoke test

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  offline-tablet:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_TABLET_IMAGE: 'system-images;android-35;default;x86_64'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK and tablet system image
        run: |
          mkdir -p build/ci
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$RUNNER_TEMP/android-sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          tools_dir="$ANDROID_HOME/cmdline-tools/latest/bin"
          if [[ ! -x "$tools_dir/sdkmanager" || ! -x "$tools_dir/avdmanager" ]]; then
            archive="$RUNNER_TEMP/commandlinetools-linux-11076708_latest.zip"
            curl --fail --silent --show-error --retry 3 --location \
              --output "$archive" "https://dl.google.com/android/repository/${archive##*/}"
            printf '%s  %s\n' \
              '2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258' "$archive" \
              | sha256sum --check
            unpack_dir="$(mktemp -d "$RUNNER_TEMP/android-tools.XXXXXX")"
            unzip -q "$archive" -d "$unpack_dir"
            mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
            cp -R "$unpack_dir/cmdline-tools/." "$ANDROID_HOME/cmdline-tools/latest/"
            # sdkmanager closes its input once it finishes reading licence responses.
            (set +o pipefail; yes | "$tools_dir/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses)
          fi
          "$tools_dir/sdkmanager" --sdk_root="$ANDROID_HOME" --install \
            "platforms;android-35" "build-tools;35.0.0" "platform-tools" "emulator" "$ANDROID_TABLET_IMAGE" \
            2>&1 | tee build/ci/sdk-install.log
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$ANDROID_HOME" "$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          printf '%s\n' "$tools_dir" >> "$GITHUB_PATH"

      - name: Check approval and release validation
        run: python3 -m unittest discover -s tests -p test_release.py

      - name: Build the preview and both CI-signed releases
        run: |
          export APPFORKIDS_KEYSTORE="$RUNNER_TEMP/appforkids-ci.p12"
          export APPFORKIDS_KEY_ALIAS=appforkids-ci
          export APPFORKIDS_STORE_PASSWORD="$(openssl rand -hex 24)"
          export APPFORKIDS_KEY_PASSWORD="$APPFORKIDS_STORE_PASSWORD"
          keytool -genkeypair -keystore "$APPFORKIDS_KEYSTORE" -storetype PKCS12 \
            -storepass:env APPFORKIDS_STORE_PASSWORD -alias "$APPFORKIDS_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 365 -dname 'CN=AppForKids CI'
          ./gradlew --no-daemon :app:assembleRelease :app:lintRelease :app:assembleDebug 2>&1 | tee build/ci/gradle.log
          baseline=app/build/outputs/apk/release/app-release.apk
          approvals="$RUNNER_TEMP/appforkids-approvals"
          python3 scripts/release.py approve --store "$approvals" tests/fixtures/les-jetons-a-reunir.json
          python3 scripts/release.py approve --store "$approvals" tests/fixtures/compter-les-etoiles-corrige.json
          python3 - "$RUNNER_TEMP/jetons-revision-3.json" <<'PYTHON'
          import json
          import sys
          from pathlib import Path
          game = json.loads(Path("tests/fixtures/les-jetons-a-reunir.json").read_text(encoding="utf-8"))
          game.update(revision=3, title="Les jetons à réunir (autre version)")
          Path(sys.argv[1]).write_text(json.dumps(game, ensure_ascii=False), encoding="utf-8")
          PYTHON
          python3 scripts/release.py approve --store "$approvals" "$RUNNER_TEMP/jetons-revision-3.json"
          python3 scripts/release.py build --store "$approvals" \
            --game les-jetons-a-reunir@2 --game compter-les-etoiles@2 \
            --version-code 2 --previous-apk "$baseline" --output build/ci/app-release-update.apk \
            2>&1 | tee build/ci/gradle-update.log

      - name: Scan repository and build artifacts with Grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          path: .
          fail-build: true
          output-format: table
          severity-cutoff: medium

      - name: Enable KVM for the hosted runner
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check

      - name: Play the starter, preview and in-place update on an offline tablet
        run: |
          bash scripts/test-apk-on-emulator.sh \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/debug/app-debug.apk \
            build/ci/app-release-update.apk

      - name: Upload tested starter APK
        uses: actions/upload-artifact@v4
        with:
          name: appforkids-ci-tested-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload tested update APK
        uses: actions/upload-artifact@v4
        with:
          name: appforkids-ci-tested-update-apk
          path: build/ci/app-release-update.apk
          if-no-files-found: error

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-failure-diagnostics
          path: |
            build/ci/
            app/build/reports/lint-results-release.xml
          if-no-files-found: warn
