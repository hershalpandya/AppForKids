name: Android APK smoke test

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  offline-tablet:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK and tablet system image
        run: |
          mkdir -p build/ci
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-35;default;x86_64" 2>&1 | tee build/ci/sdk-install.log

      - name: Build and verify CI-signed APK
        run: |
          export APPFORKIDS_KEYSTORE="$RUNNER_TEMP/appforkids-ci.p12"
          export APPFORKIDS_KEY_ALIAS=appforkids-ci
          export APPFORKIDS_STORE_PASSWORD="$(openssl rand -hex 24)"
          export APPFORKIDS_KEY_PASSWORD="$APPFORKIDS_STORE_PASSWORD"
          keytool -genkeypair -keystore "$APPFORKIDS_KEYSTORE" -storetype PKCS12 \
            -storepass:env APPFORKIDS_STORE_PASSWORD -alias "$APPFORKIDS_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 365 -dname 'CN=AppForKids CI'
          ./gradlew --no-daemon :app:assembleRelease 2>&1 | tee build/ci/gradle.log
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk

      - name: Enable KVM for the hosted runner
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check

      - name: Install the APK on an offline tablet and play a round
        run: bash scripts/test-apk-on-emulator.sh app/build/outputs/apk/release/app-release.apk

      - name: Upload tested APK
        uses: actions/upload-artifact@v4
        with:
          name: appforkids-ci-tested-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-failure-diagnostics
          path: build/ci/
          if-no-files-found: warn
