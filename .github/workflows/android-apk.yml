name: Android APK smoke test

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  offline-tablet:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_TABLET_IMAGE: 'system-images;android-35;default;x86_64'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK and tablet system image
        run: |
          mkdir -p build/ci
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$RUNNER_TEMP/android-sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          tools_dir="$ANDROID_HOME/cmdline-tools/latest/bin"
          if [[ ! -x "$tools_dir/sdkmanager" || ! -x "$tools_dir/avdmanager" ]]; then
            archive="$RUNNER_TEMP/commandlinetools-linux-11076708_latest.zip"
            curl --fail --silent --show-error --retry 3 --location \
              --output "$archive" "https://dl.google.com/android/repository/${archive##*/}"
            printf '%s  %s\n' \
              '2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258' "$archive" \
              | sha256sum --check
            unpack_dir="$(mktemp -d "$RUNNER_TEMP/android-tools.XXXXXX")"
            unzip -q "$archive" -d "$unpack_dir"
            mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
            cp -R "$unpack_dir/cmdline-tools/." "$ANDROID_HOME/cmdline-tools/latest/"
            # sdkmanager closes its input once it finishes reading licence responses.
            (set +o pipefail; yes | "$tools_dir/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses)
          fi
          "$tools_dir/sdkmanager" --sdk_root="$ANDROID_HOME" --install \
            "platforms;android-35" "build-tools;35.0.0" "platform-tools" "emulator" "$ANDROID_TABLET_IMAGE" \
            2>&1 | tee build/ci/sdk-install.log
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$ANDROID_HOME" "$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          printf '%s\n' "$tools_dir" >> "$GITHUB_PATH"

      - name: Build and verify CI-signed APK
        run: |
          export APPFORKIDS_KEYSTORE="$RUNNER_TEMP/appforkids-ci.p12"
          export APPFORKIDS_KEY_ALIAS=appforkids-ci
          export APPFORKIDS_STORE_PASSWORD="$(openssl rand -hex 24)"
          export APPFORKIDS_KEY_PASSWORD="$APPFORKIDS_STORE_PASSWORD"
          keytool -genkeypair -keystore "$APPFORKIDS_KEYSTORE" -storetype PKCS12 \
            -storepass:env APPFORKIDS_STORE_PASSWORD -alias "$APPFORKIDS_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 365 -dname 'CN=AppForKids CI'
          ./gradlew --no-daemon :app:assembleRelease :app:lintRelease 2>&1 | tee build/ci/gradle.log
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk

      - name: Enable KVM for the hosted runner
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check

      - name: Install the APK on an offline tablet and play a round
        run: bash scripts/test-apk-on-emulator.sh app/build/outputs/apk/release/app-release.apk

      - name: Upload tested APK
        uses: actions/upload-artifact@v4
        with:
          name: appforkids-ci-tested-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-failure-diagnostics
          path: |
            build/ci/
            app/build/reports/lint-results-release.xml
          if-no-files-found: warn
