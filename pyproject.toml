[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["scripts", "tests"]

# Only release.py is production Python; the other scripts drive APK tests.
[tool.coverage.run]
include = ["scripts/release.py"]
patch = ["subprocess"]

[tool.coverage.report]
include = ["scripts/release.py"]
fail_under = 70
precision = 2
show_missing = true
